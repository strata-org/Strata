name: Install cvc5
description: >
  Download a static cvc5 build and put it on the PATH. Supports both
  x86_64 and aarch64 Linux runners. Consolidates the cvc5 install logic
  previously duplicated across ci.yml and cbmc.yml; intended to also be
  adopted by the python-fuzz workflow once that lands (see
  https://github.com/strata-org/Strata/pull/984).

inputs:
  version:
    description: cvc5 release tag (e.g. "1.3.4").
    required: false
    default: "1.3.4"
  install-to:
    description: >
      Where to make the cvc5 binary available. One of:
        "path"    (default) — prepend the unpacked bin/ directory to $GITHUB_PATH.
        "system"  — sudo cp the cvc5 binary into /usr/local/bin/.
    required: false
    default: "path"
  safe-mode:
    description: >
      One of "unrestricted" (same as empty, the default), "safe", "stable".
      If set to "safe" or "stable", `cvc5` becomes a wrapper that runs the
      real binary (`cvc5-bin`) with `--safe-mode=<value>` as its first
      argument. "stable" rejects expert options, more than one regular option
      per run, and expert theories (e.g. higher-order logic, bags, finite
      fields).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Download cvc5
      shell: bash
      env:
        CVC5_VERSION: ${{ inputs.version }}
        INSTALL_TO: ${{ inputs.install-to }}
        SAFE_MODE: ${{ inputs.safe-mode }}
      run: |
        set -eu
        ARCH=$(uname -m)
        case "$ARCH" in
          x86_64)         ARCH_NAME="x86_64" ;;
          aarch64|arm64)  ARCH_NAME="arm64" ;;
          *) echo "Unsupported architecture: $ARCH" >&2; exit 1 ;;
        esac
        URL="https://github.com/cvc5/cvc5/releases/download/cvc5-${CVC5_VERSION}/cvc5-Linux-${ARCH_NAME}-static.zip"
        wget -q "$URL"
        unzip -q "cvc5-Linux-${ARCH_NAME}-static.zip"
        BIN_DIR="cvc5-Linux-${ARCH_NAME}-static/bin"
        chmod +x "$BIN_DIR/cvc5"
        case "$SAFE_MODE" in
          ""|unrestricted) ;;
          safe|stable)
            # Replace `cvc5` with a wrapper that execs the real binary, now
            # `cvc5-bin` beside it, with `--safe-mode` as the first argument:
            # options given before it are not restricted.
            [ -e "$BIN_DIR/cvc5-bin" ] || mv "$BIN_DIR/cvc5" "$BIN_DIR/cvc5-bin"
            printf '#!/bin/sh\nexec "$(dirname "$0")/cvc5-bin" --safe-mode=%s "$@"\n' \
              "$SAFE_MODE" > "$BIN_DIR/cvc5"
            chmod +x "$BIN_DIR/cvc5"
            ;;
          *)
            echo "Unknown safe-mode value: $SAFE_MODE" >&2
            exit 2
            ;;
        esac
        case "$INSTALL_TO" in
          path)
            echo "$GITHUB_WORKSPACE/$BIN_DIR/" >> "$GITHUB_PATH"
            ;;
          system)
            sudo cp "$BIN_DIR"/cvc5* /usr/local/bin/
            ;;
          *)
            echo "Unknown install-to value: $INSTALL_TO" >&2
            exit 2
            ;;
        esac

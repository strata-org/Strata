name = "Strata"
version = "0.1.0"
defaultTargets = ["Strata", "StrataToCBMC", "StrataCoreToGoto", "laurelJavaGen"]
testDriver = "StrataTestMain"
lintDriver = "CheckImports"

[leanOptions]
warningAsError = true

[[require]]
name = "StrataDDM"
git = "https://github.com/strata-org/Strata-DDM"
rev = "main"

[[require]]
name = "plausible"
git = "https://github.com/leanprover-community/plausible.git"
rev = "bump_to_v4.29.0-rc8"

[[lean_lib]]
name = "Strata"
moreLeancArgs = ["-fbracket-depth=512"]

# Editor syntax-highlighting generator, factored out of `editors/GenSyntax.lean`
# so `StrataTest.EditorSyntaxFreshness` can reuse it for the freshness check.
# `srcDir` points at `editors/` so the module resolves to `editors/CoreSyntaxGen.lean`.
[[lean_lib]]
name = "CoreSyntaxGen"
srcDir = "editors"
globs = ["CoreSyntaxGen"]

[[lean_lib]]
name = "StrataExamples"
globs = ["Examples.Lean.+"]

[[lean_lib]]
name = "StrataTest"
globs = ["StrataTest.+"]

[[lean_exe]]
name = "StrataTestMain"
root = "Scripts.StrataTestMain"
# `Strata` is listed explicitly because the driver spawns `lean` on files
# under `StrataTestExtra/` (which is not a `lean_lib`). Those files import
# modules from the `Strata` library that are not in `StrataTest`'s transitive
# closure (e.g., `Strata.Java.Gen`), so without this the oleans would be
# missing when running `lake test` from a clean `.lake`.
needs = ["Strata", "StrataTest", "laurelJavaGen"]

[[lean_exe]]
name = "StrataToCBMC"

[[lean_exe]]
name = "StrataCoreToGoto"

[[lean_exe]]
name = "CheckImports"
root = "Scripts.CheckImports"

[[lean_exe]]
name = "ImportStats"
root = "Scripts.ImportStats"

[[lean_exe]]
name = "GenerateEmbedded"
root = "Scripts.GenerateEmbedded"

[[lean_exe]]
name = "laurelJavaGen"
root = "Scripts.LaurelJavaGen"

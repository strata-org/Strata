name = "Strata"
version = "0.1.0"
defaultTargets = ["Strata", "StrataToCBMC", "StrataCoreToGoto", "laurelJavaGen", "laurelGoGen", "strataLaurel", "laurelToCBMC", "CoreSyntaxGen"]
testDriver = "StrataTestMain"
lintDriver = "CheckImports"

[leanOptions]
warningAsError = true

[[require]]
name = "StrataDDM"
git = "https://github.com/strata-org/Strata-DDM"
rev = "main"

[[require]]
name = "plausible"
git = "https://github.com/leanprover-community/plausible.git"
rev = "v4.34.0"

[[lean_lib]]
name = "Strata"
moreLeancArgs = ["-fbracket-depth=512"]

# Editor syntax-highlighting generator, factored out of `editors/GenSyntax.lean`
# so `StrataTest.EditorSyntaxFreshness` can reuse it for the freshness check.
# `srcDir` points at `editors/` so the module resolves to `editors/CoreSyntaxGen.lean`.
[[lean_lib]]
name = "CoreSyntaxGen"
srcDir = "editors"
globs = ["CoreSyntaxGen"]

# One top-level directory groups the Laurel implementation, scripts and tests.
[[lean_lib]]
name = "StrataLaurel"
roots = ["StrataLaurel.Implementation"]

[[lean_lib]]
name = "StrataLaurelTest"
roots = []
globs = ["StrataLaurel.Tests.+"]

[[lean_lib]]
name = "StrataExamples"
globs = ["Examples.Lean.+"]

[[lean_lib]]
name = "StrataTest"
globs = ["StrataTest.+"]

[[lean_exe]]
name = "StrataTestMain"
root = "Scripts.StrataTestMain"
# `Strata` is listed explicitly because the driver spawns `lean` on files
# under `StrataTestExtra/` (which is not a `lean_lib`). Those files import
# modules from the `Strata` library that are not in `StrataTest`'s transitive
# closure (e.g., `Strata.Java.Gen`, `Strata.Go.Gen`), so without this the
# oleans would be missing when running `lake test` from a clean `.lake`.
needs = ["Strata", "StrataLaurel", "StrataTest", "StrataLaurelTest", "laurelJavaGen", "laurelGoGen"]

[[lean_exe]]
name = "StrataToCBMC"

[[lean_exe]]
name = "StrataCoreToGoto"

[[lean_exe]]
name = "CheckImports"
root = "Scripts.CheckImports"

[[lean_exe]]
name = "ImportStats"
root = "Scripts.ImportStats"

[[lean_exe]]
name = "GenerateEmbedded"
root = "Scripts.GenerateEmbedded"

[[lean_exe]]
name = "laurelJavaGen"
root = "StrataLaurel.Scripts.LaurelJavaGen"

[[lean_exe]]
name = "laurelGoGen"
root = "StrataLaurel.Scripts.LaurelGoGen"

[[lean_exe]]
name = "strataLaurel"
root = "StrataLaurel.Scripts.StrataLaurelMain"

# `StrataLaurel/Tests/CBMC/run_laurel_cbmc_tests.sh` runs this script with
# `lean --run`; building it as a default target keeps it compiling.
[[lean_exe]]
name = "laurelToCBMC"
root = "StrataLaurel.Scripts.LaurelToCBMC"

[project]
name = "strataagent"
version = "0.1.0"
description = "Multi-agent orchestration framework for claude_agent_sdk"
requires-python = ">=3.14"
dependencies = [
    "claude-agent-sdk>=0.2.82",
    "itp-interface>=1.9.0; python_version < '4'",
    "jinja2>=3.1",
    "pydantic>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Only these are Python packages. Without this, setuptools' flat-layout
# autodiscovery trips over the sibling non-package dirs (temp, Sandbox,
# LeanTools) and refuses to build.
include = ["strataswarm*", "swarm_nudges*"]

[tool.uv]
# itp-interface installed with --no-deps (numpy build fails on GCC 7.3)
# Install manually: uv pip install itp-interface==1.9.0 --no-deps
# Then: LEAN_VERSION="4.29.1" install-itp-interface
no-build-isolation-package = ["itp-interface"]
